name: Build mod

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create mod zip
        run: |
          cd wx_autoharvester
          zip -r ../wx-autoharvester.zip .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wx-autoharvester
          path: wx-autoharvester.zip
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: wx-autoharvester.zip
